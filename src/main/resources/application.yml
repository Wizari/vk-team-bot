server:
  port: 9222
  servlet:
    context-path: /

spring:
  application:
    name: vk-team-bot

vk-team:
  access-token: "YOUR_ACCESS_TOKEN" # Токен сообщества VK Team
  api-version: "5.199" # Версия API
  confirmation-token: "YOUR_CONFIRMATION_TOKEN" # Строка для подтверждения
  secret-key: "YOUR_SECRET_KEY" # Секретный ключ (опционально)

logging:
  level:
    com.example.vkteambot: DEBUG